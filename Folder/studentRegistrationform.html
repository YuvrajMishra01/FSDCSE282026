<html lang="en">
<head>

</head>
<h1 style="text-align:center;font-style: italic;background:yellow;;">
    Fill the details
</h1>
<body>
    <fieldset style="background-color:pink">
        <legend style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">Student Details</legend>
    <form>
        First name:<input type="text" placeholder="First name">
        
        <br>
        <br>

        <br><br>

        <input type="radio" name="radio">
        <label>Female</label>
        <br><br>

        <input type="number" placeholder="Age">

        <br><br>

<label>Phone Number:</label>
<input type="tel" placeholder="Phone Number">
<br><br>
<label>Email id:</label>
<input type="character" placeholder="Email id">

<label style="font-size: small;font-style: oblique;">*Make sure all the information filled is correct.</label>
<br><br>
<input type="submit">

</fieldset>

    </form>
